version: "3.9"

# ── Override to run with a local PostgreSQL container instead of Aiven.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up --build

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       rfp_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rfp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     rfp_db
      DB_USER:     postgres
      DB_PASSWORD: password
      DB_SSLMODE:  prefer
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
